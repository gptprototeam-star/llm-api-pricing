# ---------------------------------------------------------------------------
# sources.yaml — where every number in data/pricing.json comes from.
#
# `update_prices.py` reads this file. Each model row in the dataset is read
# from GPTProto's public catalog, which publishes the upstream rate
# ("official price") next to its own rate on the same page — so one fetch
# yields a comparison baseline instead of a bare number.
#
# `vendors.<slug>.pricing_url` is the upstream provider page that the row's
# `official_price_source_url` points at, so a reader can check the list price
# against the vendor itself rather than against us.
#
# The `slug` keys are the vendor segment of the catalog URL
# (https://gptproto.com/model/<slug>/<model>). Keep them in sync — a model
# whose slug is missing here still gets published, it just keeps a null
# `official_price_source_url`.
#
# `verified` is the date a human last confirmed the page resolves. A page that
# answers 403 to a plain HTTP client (bot protection) is still listed, with a
# note, because the rate is reproducible in a browser.
# ---------------------------------------------------------------------------

dataset:
  name: llm-api-pricing
  catalog_url: https://gptproto.com/model
  sitemap_url: https://gptproto.com/sitemap-models.xml
  model_list_api: https://gptproto.com/v1/models
  llms_txt: https://gptproto.com/llms.txt
  currency: USD
  unit: per_1m_tokens

vendors:
  openai:
    name: OpenAI
    pricing_url: https://openai.com/api/pricing/
    verified: 2026-09-24
    note: answers 403 to plain HTTP clients; verify in a browser
